name: Deploying to richmedia.ma

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploying to richmedia.ma
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://richmedia.ma

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_WEBROOT: ${{ secrets.VPS_WEBROOT }}
        run: |
          set -euo pipefail
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          release_path="$VPS_WEBROOT/releases/$release"
          ssh_opts="-i $HOME/.ssh/vps_deploy_key -p $VPS_PORT -o IdentitiesOnly=yes"

          ssh $ssh_opts "$VPS_USER@$VPS_HOST" "install -d -m 755 '$release_path'"
          rsync -az --delete -e "ssh $ssh_opts" dist/ "$VPS_USER@$VPS_HOST:$release_path/"

          ssh $ssh_opts "$VPS_USER@$VPS_HOST" "
            set -e
            chown -R www-data:www-data '$release_path'
            ln -sfn '$release_path' '$VPS_WEBROOT/current'
            nginx -t
          "
