# Include this file inside the active richmedia.ma server block, before the
# generic / location. The deployment workflow installs an equivalent snippet in
# /etc/nginx/snippets/richmedia-contact-api.conf and reloads Nginx.

location = /api/contact {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 20s;
  proxy_connect_timeout 5s;
  proxy_pass http://127.0.0.1:8787/api/contact;
}
