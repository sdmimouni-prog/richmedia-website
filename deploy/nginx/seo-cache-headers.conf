# Include this file inside the active richmedia.ma server block, before the
# generic static asset location. Then run:
#   nginx -t && systemctl reload nginx
#
# Purge these URLs from Cloudflare after reload:
#   https://richmedia.ma/robots.txt
#   https://richmedia.ma/sitemap-index.xml
#   https://richmedia.ma/sitemap-0.xml

location = /robots.txt {
  expires off;
  add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
  add_header Pragma "no-cache" always;
}

location = /sitemap-index.xml {
  expires off;
  add_header Cache-Control "public, max-age=300, s-maxage=300, must-revalidate" always;
}

location ~ ^/sitemap-[0-9]+\.xml$ {
  expires off;
  add_header Cache-Control "public, max-age=300, s-maxage=300, must-revalidate" always;
}
